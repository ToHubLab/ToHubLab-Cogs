name: Discord Benachrichtigung

on:
  push:
    branches:
      - main
      - master

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Letzten Commit an Discord senden
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.html_url }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "username": "GitHub",
              "embeds": [{
                  "title": "Neue Änderung im Repository",
                  "description": os.environ["COMMIT_MESSAGE"][:4000],
                  "url": os.environ["COMMIT_URL"],
                  "color": 5814783,
                  "fields": [
                      {
                          "name": "Autor",
                          "value": os.environ["AUTHOR"] or "Unbekannt",
                          "inline": True
                      },
                      {
                          "name": "Branch",
                          "value": os.environ["BRANCH"],
                          "inline": True
                      }
                  ]
              }]
          }

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord antwortete mit HTTP {response.status}")
          PY
